name: Live Integration Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  live-test:
    strategy:
      matrix:
        forgejo-version: ['10', '11']

    runs-on: docker
    container: node:20

    services:
      forgejo:
        image: codeberg.org/forgejo/forgejo:${{ matrix.forgejo-version }}
        env:
          FORGEJO__security__INSTALL_LOCK: "true"
          FORGEJO__server__ROOT_URL: "http://forgejo:3000"
          FORGEJO__database__DB_TYPE: sqlite3
          FORGEJO__service__DISABLE_REGISTRATION: "false"
          FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"

    env:
      FORGEJO_TEST_URL: http://forgejo:3000

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update && apt-get install -y jq curl xvfb libgtk-3-0 libxss1 libasound2 libgbm1 libnspr4 libnss3
        npm ci

    - name: Wait for Forgejo & setup test data
      run: bash scripts/setup-forgejo-test.sh

    - name: Run live integration tests
      run: npm run test:live

    - name: Create test workspace for Playwright
      run: |
        mkdir -p /tmp/forgejo-test-workspace
        cd /tmp/forgejo-test-workspace
        git init
        git remote add origin http://forgejo:3000/testuser/test-repo.git

    - name: Compile extension
      run: npm run compile

    - name: Run Playwright VS Code live tests
      run: xvfb-run -a npm run test:e2e:live
      env:
        FORGEJO_LIVE_WORKSPACE: /tmp/forgejo-test-workspace
