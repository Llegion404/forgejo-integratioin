name: Test

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  test:
    strategy:
      matrix:
        node-version: ['18', '20']

    runs-on: docker
    container: node:${{ matrix.node-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Install xvfb and dependencies
      run: |
        apt-get update
        apt-get install -y xvfb libgtk-3-0 libxss1 libasound2 libgbm1 libnspr4 libnss3

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit:coverage

    - name: Run integration tests
      run: |
        npm run compile
        xvfb-run -a npm run test:integration

  smoke-test-vsix:
    runs-on: docker
    container: node:20

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: npm ci

    - name: Package and verify .vsix contents
      run: |
        npm run package
        VSIX=$(ls -t *.vsix | head -1)
        echo "Checking .vsix: $VSIX"
        unzip -l "$VSIX" > /tmp/vsix-contents.txt

        REQUIRED=(
          "extension/out/extension.js"
          "extension/node_modules/forgejo-ts/package.json"
          "extension/node_modules/forgejo-ts/dist/index.js"
          "extension/package.json"
        )

        FAILED=0
        for path in "${REQUIRED[@]}"; do
          if grep -q "$path" /tmp/vsix-contents.txt; then
            echo "OK: $path"
          else
            echo "MISSING: $path"
            FAILED=1
          fi
        done

        if [ "$FAILED" -ne 0 ]; then
          echo "--- Full .vsix contents ---"
          cat /tmp/vsix-contents.txt
          exit 1
        fi
        echo "All required files present in .vsix"
