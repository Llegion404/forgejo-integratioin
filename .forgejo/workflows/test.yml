name: Test

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  test:
    strategy:
      matrix:
        node-version: ['18', '20']

    runs-on: docker
    container: node:${{ matrix.node-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Install xvfb and dependencies
      run: |
        apt-get update
        apt-get install -y xvfb libgtk-3-0 libxss1 libasound2 libgbm1 libnspr4 libnss3

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit:coverage

    - name: Run integration tests
      run: |
        npm run compile
        xvfb-run -a npm run test:integration
